server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets can be cached for a year.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: React Router handles every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
